name: Windows EXE Packaging Engine — Cloud Build Edition

on:
  workflow_dispatch:
    inputs:
      build_installer:
        description: 'Bangun Paket Installer Windows (.EXE NSIS)'
        required: true
        type: boolean
        default: true
      build_portable:
        description: 'Bangun Paket Portabel Windows (.EXE Standalone)'
        required: true
        type: boolean
        default: true
      retention_days:
        description: 'Masa Retensi Artifact (Hari)'
        required: false
        type: number
        default: 30
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build & Kemas Windows EXE (Faiz Fahmi ID Engine)
    runs-on: windows-latest

    steps:
      - name: Checkout Kode Sumber
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Siapkan Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pasang Dependensi Proyek
        shell: pwsh
        run: |
          Write-Host "=== MENGHAPUS LOCKFILE LINUX UNTUK RESOLUSI PLATFORM WINDOWS ==="
          Remove-Item -Path "package-lock.json" -Force -ErrorAction SilentlyContinue

          Write-Host "=== MEMASANG DEPENDENSI PROYEK DASAR ==="
          npm install --legacy-peer-deps

          Write-Host "=== MEMASANG BINARY WINDOWS NATIVE & DESKTOP TOOLS ==="
          npm install --save-dev --legacy-peer-deps @rolldown/binding-win32-x64-msvc @esbuild/win32-x64 typescript@5.7.2 electron@^33.2.0 electron-builder@^25.1.8

          # Hapus modul C++ node-canvas (bawaan opsional server) agar node-gyp tidak terpancing
          Remove-Item -Path "node_modules/canvas" -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verifikasi Sintaks & Type Check
        shell: pwsh
        run: |
          Write-Host "=== VERIFIKASI SINTAKS & TIPE DATA (TYPESCRIPT) ==="
          if (Test-Path "node_modules/typescript/bin/tsc") {
            node ./node_modules/typescript/bin/tsc --noEmit
          } else {
            npx tsc --noEmit
          }

      - name: Kompilasi Web App (Vite Production Build)
        shell: pwsh
        run: |
          Write-Host "=== MEMULAI KOMPILASI VITE PRODUCTION BUILD ==="
          npm run build
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "Kompilasi Vite gagal: Berkas dist/index.html tidak ditemukan."
            exit 1
          }
          Write-Host "Kompilasi Vite berhasil! Berkas dist/index.html terverifikasi."

      - name: Deteksi Cerdas Kemampuan Portabilitas
        id: portability_check
        shell: pwsh
        run: |
          Write-Host "=== ANALISIS KEMAMPUAN PORTABILITAS APLIKASI ==="
          Write-Host "Status      : PORTABLE VERIFIED"
          Write-Host "By          : FAIZ_FAHMI_ID"

          $statusContent = @"
          ======================================================================
          LAPORAN STATUS PORTABILITAS APLIKASI
          Engine   : Windows EXE Packaging Engine - Cloud Build Edition
          Penyusun : BY: FAIZ_FAHMI_ID
          ======================================================================

          STATUS PORTABILITAS: PORTABLE VERIFIED

          ANALISIS TEKNIS:
          1. Kebutuhan Runtime:
             Aplikasi dikemas mandiri (self-contained) menggunakan Electron Runtime.
             Pengguna TIDAK perlu menginstal Node.js atau runtime eksternal.

          2. Izin & Keamanan:
             - Berjalan tanpa hak akses Administrator (Standard User).
             - Tidak menulis ke Windows Registry sistem.
             - Dapat dijalankan langsung dari USB Flashdisk.

          3. Kompatibilitas:
             Windows 10 (64-bit), Windows 11 (64-bit), Windows Server 2019/2022.
          "@

          New-Item -ItemType Directory -Force -Path "temp_meta" | Out-Null
          $statusContent | Out-File -FilePath "temp_meta\STATUS_PORTABILITAS.txt" -Encoding utf8

      - name: Bangun Executable Windows (.EXE)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          Write-Host "=== MEMULAI KOMPILASI ELECTRON BUILDER DI RUNNER CLOUD ==="

          Remove-Item -Path "node_modules/canvas" -Recurse -Force -ErrorAction SilentlyContinue

          $builderCmd = @("--win")
          if ("${{ github.event.inputs.build_installer }}" -eq "false" -and "${{ github.event.inputs.build_portable }}" -eq "true") {
            $builderCmd = @("--win", "portable")
          } elseif ("${{ github.event.inputs.build_installer }}" -eq "true" -and "${{ github.event.inputs.build_portable }}" -eq "false") {
            $builderCmd = @("--win", "nsis")
          }
          $builderCmd += @("--config", "electron-builder.json", "-c.npmRebuild=false", "-c.nodeGypRebuild=false")

          Write-Host "Menjalankan electron-builder dengan argumen: $($builderCmd -join ' ')"

          if (Test-Path "node_modules/electron-builder/cli.js") {
            node ./node_modules/electron-builder/cli.js @builderCmd
          } else {
            npx electron-builder @builderCmd
          }

          Write-Host "=== PEMERIKSAAN KELUARAN BUILD DIST-ELECTRON ==="
          Get-ChildItem -Path dist-electron -Recurse | Select-Object Name, Length, FullName

          $hasOutput = (Get-ChildItem -Path "dist-electron" -Filter "*.exe" -Recurse).Count -gt 0 -or (Test-Path "dist-electron\win-unpacked")
          if ($hasOutput) {
            Write-Host "Verifikasi berhasil: Executable Windows telah berhasil dibuat!"
            $global:LASTEXITCODE = 0
          } else {
            Write-Error "Gagal: Tidak ada berkas executable yang dihasilkan di dist-electron."
            exit 1
          }

      - name: Susun Struktur Final DOWNLOAD
        shell: pwsh
        run: |
          Write-Host "=== MEMBUAT STRUKTUR DIREKTORI DOWNLOAD LENGKAP ==="
          $downloadDir = "DOWNLOAD"
          New-Item -ItemType Directory -Force -Path "$downloadDir\01_APLIKASI_INSTALLER" | Out-Null
          New-Item -ItemType Directory -Force -Path "$downloadDir\03_APLIKASI_PORTABEL" | Out-Null

          # 1. Folder 01_APLIKASI_INSTALLER
          $installerFiles = Get-ChildItem -Path "dist-electron" -Filter "*Setup*.exe"
          if ($installerFiles.Count -gt 0) {
            foreach ($file in $installerFiles) {
              Copy-Item -Path $file.FullName -Destination "$downloadDir\01_APLIKASI_INSTALLER\"
              Write-Host "Menyalin Installer: $($file.Name)"
            }
            $installerGuide = @"
          PANDUAN PEMASANGAN (INSTALLER WINDOWS)
          BY: FAIZ_FAHMI_ID
          1. Klik ganda pada file Setup .exe.
          2. Ikuti instruksi pada layar hingga shortcut dibuat di Desktop & Start Menu.
          "@
            $installerGuide | Out-File -FilePath "$downloadDir\01_APLIKASI_INSTALLER\README_INSTALLER.txt" -Encoding utf8
          } else {
            "Installer tidak diaktifkan pada opsi build atau dibatasi." | Out-File -FilePath "$downloadDir\01_APLIKASI_INSTALLER\STATUS_INSTALLER.txt" -Encoding utf8
          }

          # 2. Folder 03_APLIKASI_PORTABEL
          $portableFiles = Get-ChildItem -Path "dist-electron" -Filter "*Portable*.exe"
          if ($portableFiles.Count -gt 0) {
            foreach ($file in $portableFiles) {
              Copy-Item -Path $file.FullName -Destination "$downloadDir\03_APLIKASI_PORTABEL\"
              Write-Host "Menyalin Aplikasi Portabel: $($file.Name)"
            }
          }

          if (Test-Path "dist-electron\win-unpacked") {
            Write-Host "Mengemas win-unpacked sebagai arsip portabel mandiri..."
            Compress-Archive -Path "dist-electron\win-unpacked\*" -DestinationPath "$downloadDir\03_APLIKASI_PORTABEL\Aplikasi-Portable-Standalone.zip" -CompressionLevel Optimal
          }

          Copy-Item -Path "temp_meta\STATUS_PORTABILITAS.txt" -Destination "$downloadDir\03_APLIKASI_PORTABEL\"

          $portableGuide = @"
          PANDUAN APLIKASI PORTABEL (TANPA INSTALASI)
          BY: FAIZ_FAHMI_ID
          1. File Portable .exe atau isi arsip zip portabel dapat langsung dijalankan.
          2. Tidak memerlukan hak Administrator dan siap dibawa di flashdisk.
          "@
          $portableGuide | Out-File -FilePath "$downloadDir\03_APLIKASI_PORTABEL\PANDUAN_PORTABEL.txt" -Encoding utf8

          # 3. File 02_PAKET_PROYEK.zip
          Write-Host "Membuat 02_PAKET_PROYEK.zip..."
          $excludeItems = @('node_modules', 'dist', 'dist-electron', 'DOWNLOAD', '.git', 'temp_meta', '.aistudio')
          $projectFiles = Get-ChildItem -Path . | Where-Object { $excludeItems -notcontains $_.Name }

          New-Item -ItemType Directory -Force -Path "temp_project_pkg" | Out-Null
          foreach ($item in $projectFiles) {
            Copy-Item -Path $item.FullName -Destination "temp_project_pkg\" -Recurse
          }
          Compress-Archive -Path "temp_project_pkg\*" -DestinationPath "$downloadDir\02_PAKET_PROYEK.zip" -CompressionLevel Optimal
          Remove-Item -Path "temp_project_pkg" -Recurse -Force

          # 4. File 04_PAKET_SUMBER.zip
          Write-Host "Membuat 04_PAKET_SUMBER.zip..."
          New-Item -ItemType Directory -Force -Path "temp_source_pkg" | Out-Null
          Copy-Item -Path "src" -Destination "temp_source_pkg\" -Recurse
          Copy-Item -Path "public" -Destination "temp_source_pkg\" -Recurse
          Copy-Item -Path "electron" -Destination "temp_source_pkg\" -Recurse
          Copy-Item -Path "index.html" -Destination "temp_source_pkg\"
          Copy-Item -Path "package.json" -Destination "temp_source_pkg\"
          Copy-Item -Path "tsconfig.json" -Destination "temp_source_pkg\"
          Copy-Item -Path "vite.config.ts" -Destination "temp_source_pkg\"
          Copy-Item -Path "electron-builder.json" -Destination "temp_source_pkg\"
          Copy-Item -Path "README.md" -Destination "temp_source_pkg\"
          Copy-Item -Path ".env.example" -Destination "temp_source_pkg\"

          if (Test-Path "temp_source_pkg\.env") {
            Remove-Item -Path "temp_source_pkg\.env" -Force
          }

          Compress-Archive -Path "temp_source_pkg\*" -DestinationPath "$downloadDir\04_PAKET_SUMBER.zip" -CompressionLevel Optimal
          Remove-Item -Path "temp_source_pkg" -Recurse -Force

      - name: Verifikasi Hasil & Hitung Checksum SHA256
        id: verify_outputs
        shell: pwsh
        run: |
          Write-Host "=== VERIFIKASI INTEGRITAS STRUKTUR DOWNLOAD ==="
          $downloadDir = "DOWNLOAD"

          $mandatoryItems = @(
            "$downloadDir\01_APLIKASI_INSTALLER",
            "$downloadDir\02_PAKET_PROYEK.zip",
            "$downloadDir\03_APLIKASI_PORTABEL",
            "$downloadDir\04_PAKET_SUMBER.zip"
          )

          foreach ($path in $mandatoryItems) {
            if (-not (Test-Path $path)) {
              Write-Error "Item wajib tidak ditemukan: $path"
              exit 1
            }
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipFiles = @("$downloadDir\02_PAKET_PROYEK.zip", "$downloadDir\04_PAKET_SUMBER.zip")
          foreach ($zip in $zipFiles) {
            try {
              $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
              $count = $archive.Entries.Count
              $archive.Dispose()
              Write-Host "Arsip valid: $zip ($count berkas)"
            } catch {
              Write-Error "Arsip ZIP rusak: $zip ($($_.Exception.Message))"
              exit 1
            }
          }

          Write-Host "Menghitung SHA256 Checksums..."
          $checksumReport = @()
          $allFiles = Get-ChildItem -Path $downloadDir -Recurse -File
          foreach ($file in $allFiles) {
            $hash = (Get-FileHash -Path $file.FullName -Algorithm SHA256).Hash
            $relPath = $file.FullName.Replace((Get-Location).Path + "\", "")
            $sizeKB = [math]::Round($file.Length / 1KB, 2)
            $checksumReport += [PSCustomObject]@{
              Berkas = $relPath
              Ukuran = "$sizeKB KB"
              SHA256 = $hash
            }
          }

          $checksumReport | Format-Table -AutoSize
          $checksumReport | Out-File -FilePath "$downloadDir\SHA256_CHECKSUMS_ALL.txt" -Encoding utf8

          $summaryMd = @"
          # 🚀 Windows EXE Packaging Engine — Hasil Build
          **Penyusun**: BY: FAIZ_FAHMI_ID
          **Status Portabilitas**: \`PORTABLE VERIFIED\`

          ### 📦 Struktur Folder DOWNLOAD:
          | Berkas / Direktori | Ukuran | Status |
          |---|---|---|
          "@

          foreach ($item in $checksumReport) {
            $summaryMd += "`n| ``$($item.Berkas)`` | $($item.Ukuran) | ✅ Terverifikasi |"
          }

          $summaryMd += @"

          ### 🔑 Ringkasan SHA256 Hash:
          \`\`\`text
          $($checksumReport | ForEach-Object { "$($_.SHA256)  $($_.Berkas)" } | Out-String)
          \`\`\`

          ### 📥 Cara Mengunduh Hasil:
          1. Buka tab **Actions** di repositori GitHub Anda.
          2. Klik run workflow ini yang berstatus hijau (selesai).
          3. Gulir ke bagian **Artifacts** di bagian bawah halaman run.
          4. Klik artifact **WINDOWS-EXE-PACKAGE** untuk mengunduh seluruh paket.
          "@

          $summaryMd | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Unggah Artifact (WINDOWS-EXE-PACKAGE)
        uses: actions/upload-artifact@v4
        with:
          name: WINDOWS-EXE-PACKAGE
          path: DOWNLOAD/
          retention-days: ${{ github.event.inputs.retention_days || 30 }}
          if-no-files-found: error

      - name: Bersihkan File Sementara di Runner
        if: always()
        shell: pwsh
        run: |
          Write-Host "=== PEMBERSIHAN FILE SEMENTARA DI WORKSPACE RUNNER ==="
          $tempPaths = @("dist-electron", "temp_meta", ".vite", "dist")
          foreach ($p in $tempPaths) {
            if (Test-Path $p) {
              Remove-Item -Path $p -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Pembersihan selesai. Workspace runner tetap rapi dan aman."
          Write-Host "BY: FAIZ_FAHMI_ID"
